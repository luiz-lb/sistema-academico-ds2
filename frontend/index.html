<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <!-- UTF-8 para mostrar acentos corretamente -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Acadêmico DS II</title>

    <link rel="stylesheet" href="./css/estilo.css">

    <!--
        Ordem dos scripts: Model e View primeiro, Controller por último,
        porque o Controller usa os outros dois.
        O defer faz o script rodar só depois que o HTML foi carregado
        e mantém essa ordem.
    -->
    <script src="./js/model/aluno-model.js" defer></script>
    <script src="./js/view/aluno-view.js" defer></script>
    <script src="./js/controller/aluno-controller.js" defer></script>
</head>

<body>
    <main>
        <h1>Sistema Acadêmico DS II</h1>

        <p>Primeira versão do sistema utilizando MVC e JSON.</p>

        <!-- Nesta versão a entrada é por prompt() e a saída é no console -->
        <p>Abra o console do navegador (F12) para acompanhar a execução.</p>
    </main>
</body>

</html>
